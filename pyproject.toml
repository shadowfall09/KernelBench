[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelbench-verified"
version = "0.1.0"
requires-python = "==3.10.*"
dynamic = ["dependencies"]

[project.optional-dependencies]
gpu = ["triton", "nvidia-cutlass-dsl", "tilelang", "cupy-cuda12x", "nsight-python"]
dev = ["pytest", "ruff"]

[project.scripts]
kb-batch = "kb_workflows.cli:main"
kb-verify-worker = "kb_workflows.queue_worker:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "kb_workflows*", "scripts*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
