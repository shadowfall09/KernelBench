[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelbench-pro"
version = "0.1.0"
description = "KernelBench Pro: GPU kernel generation, validation and benchmarking workflows"
readme = "README.md"
requires-python = "==3.12.*"
dynamic = ["dependencies"]

[project.optional-dependencies]
gpu = ["triton", "nvidia-cutlass-dsl", "tilelang", "cupy-cuda12x", "nsight-python"]
dev = ["pytest", "ruff"]
harbor = ["harbor[modal]==0.24.0"]
analysis = ["matplotlib>=3.9,<4", "pyarrow>=26,<27", "msgpack>=1.1.1,<2"]
origin = ["cupti-python==13.3.0", "triton==3.7.0"]
local-model = ["transformers>=4.56,<6", "safetensors>=0.4"]
rl = ["trl==1.8.0", "transformers>=5.2,<6", "accelerate>=1.4,<2", "safetensors>=0.4"]

[project.scripts]
kb-batch = "kb_workflows.cli:main"
kb-verify-worker = "kb_workflows.runtime.queue_worker:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "kb_workflows*", "scripts*"]

[tool.setuptools.package-data]
kb_workflows = ["provenance/*.cpp", "hardware/gpu_profiles.toml", "benchmarks/manifests/*.json", "numerics/verification_contracts.json", "numerics/operator_oracles.json", "numerics/composite_programs.json", "numerics/model_programs.json", "numerics/model_input_families.json", "benchmarks/reference_revisions.json", "evaluation/baseline_rewrites.json"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
